version: "3.9"

services:
  api:
    build: .
    container_name: nexum-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts

  db:
    image: postgres:16
    container_name: nexum-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexum
      POSTGRES_USER: nexum
      POSTGRES_PASSWORD: nexum_dev_password
    ports:
      - "5432:5432"
    volumes:
      - nexum_pgdata:/var/lib/postgresql/data

volumes:
  nexum_pgdata:
